[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estudos"
version = "2.0.0"
description = "Motor da Plataforma de Estudos multi-disciplina"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "fastembed>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["estudos*"]

[tool.setuptools.package-data]
estudos = ["db/migracoes/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Testes com o modelo real (baixa ~470 MB): fora da suíte padrão e do CI. Rodar com: pytest -m modelo
addopts = "-m 'not modelo'"
markers = ["modelo: usa o modelo de embeddings real (download)"]
