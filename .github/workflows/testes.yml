name: Testes do backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    # O app roda em Windows: caminhos com acento e espaço fazem parte do que se testa.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Rodar a suíte
        run: python -m pytest -q
