name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # O app roda em Windows: caminhos com acento e espaço fazem parte do que se testa.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Rodar a suíte
        run: python -m pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _app/frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npm run check
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _app/frontend/package-lock.json
      - name: Instalar o motor
        working-directory: _app/backend
        run: python -m pip install -e .
      - run: npm ci
      - run: npx playwright install chromium
      - name: Ponta a ponta (Playwright)
        env:
          PYTHON: python
        run: npm run e2e
